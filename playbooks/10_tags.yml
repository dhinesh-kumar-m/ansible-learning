---
- name: Learn Ansible tags
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Display installation task
      ansible.builtin.debug:
        msg: "Running installation tasks"
      tags:
        - install

    - name: Display configuration task
      ansible.builtin.debug:
        msg: "Running configuration tasks"
      tags:
        - configure

    - name: Display verification task
      ansible.builtin.debug:
        msg: "Running verification tasks"
      tags:
        - verify

    - name: Display general task
      ansible.builtin.debug:
        msg: "Running general tasks"
