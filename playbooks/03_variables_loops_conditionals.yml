---
- name: Learn variables, loops and conditionals
  hosts: titan_servers
  gather_facts: true

  vars:
    app_name: tpstreams
    app_port: 8000

    packages:
      - nginx
      - docker
      - git

  tasks:
    - name: Display application details
      ansible.builtin.debug:
        msg: "{{ app_name }} runs on port {{ app_port }}"

    - name: Display package names using a loop
      ansible.builtin.debug:
        msg: "Package to check: {{ item }}"
      loop: "{{ packages }}"

    - name: Display Ubuntu-specific message
      ansible.builtin.debug:
        msg: "This server is running Ubuntu"
      when: ansible_distribution == "Ubuntu"

    - name: Display Debian-specific message
      ansible.builtin.debug:
        msg: "This server is running Debian"
      when: ansible_distribution == "Debian"
