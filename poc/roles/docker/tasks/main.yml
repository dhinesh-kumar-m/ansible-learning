---
- name: Check Docker CLI availability
  ansible.builtin.command:
    argv:
      - docker
      - --version
  register: docker_version
  changed_when: false

- name: Check Docker Compose availability
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - version
  register: docker_compose_version
  changed_when: false

- name: Verify Docker service is running
  ansible.builtin.service_facts:

- name: Ensure Docker service is running
  ansible.builtin.assert:
    that:
      - "'docker.service' in ansible_facts.services"
      - "ansible_facts.services['docker.service'].state == 'running'"
    fail_msg: Docker service is not running. Please check Docker installation.
    success_msg: Docker service is running.

- name: Display Docker versions
  ansible.builtin.debug:
    msg:
      - "{{ docker_version.stdout }}"
      - "{{ docker_compose_version.stdout }}"
